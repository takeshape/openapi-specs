      description: >-
        Multi-status. Multiple operations have taken place and the status for each operation can be viewed in the body
        of the response. Typically indicates that a partial failure has occurred, such as when a `POST` or `PUT` request
        is successful, but saving the URL or inventory data has failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBase'
