      description: Filter items by `date_modified`.
      schema:
        type: string
        format: date
    DateModifiedMaxParam:
      name: date_modified:max
      in: query
      description: >-
        Filter items by `date_modified`. If the `date modified:max` does not include hours, minutes and seconds, the API
        automatically adds the current time of the request to the date. For example, `date_modified:max=2025-01-15` or
        `date_modified:max=2025-01-15T00:03:17Z`.
      schema:
        type: string
    DateModifiedMinParam:
      name: date_modified:min
      in: query
      description: >-
        Filter items by `date_modified`. If the `date modified:min` does not include hours, minutes and seconds, the API
        automatically adds the current time of the request to the date. For example, `date_modified:min=2025-01-15` or
        `date_modified:min=2025-01-15T00:03:17Z`.
      schema:
        type: string
    DateLastImportedParam:
      name: date_last_imported
      in: query
      description: Filter items by date_last_imported.
      schema:
        type: string
        format: date
      example: {}
    DateLastImportedNotParam:
      name: date_last_imported:not
      in: query
      description: >-
        Filter products by specifying a date they were NOT last imported. For example,
        `date_last_imported:not=2015-08-21T22%3A53%3A23%2B00%3A00`.
      schema:
        type: string
        format: date
      example: {}
    DateLastImportedMaxParam:
      name: date_last_imported:max
      in: query
      description: Filter items by date_last_imported. For example, `date_last_imported:max=2015-08-21T22%3A53%3A23%2B00%3A00`.
      schema:
        type: string
        format: date
      example: {}
    DateLastImportedMinParam:
      name: date_last_imported:min
      in: query
      description: Filter items by date_last_imported. For example, `date_last_imported:min=2015-08-21T22%3A53%3A23%2B00%3A00`.
      schema:
        type: string
        format: date
      example: {}
