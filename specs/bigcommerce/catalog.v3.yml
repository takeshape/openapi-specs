openapi: 3.0.3
info:
  title: BigCommerce Catalog API
  description: Combined BigCommerce Catalog API specification including products, categories, brands, and variants.
  version: 1.0.0
servers:
  - url: https://api.bigcommerce.com/stores/{store_hash}/v3
    variables:
      store_hash:
        default: your_store_hash
tags:
  - name: Batch metafields
  - name: Brands
  - name: Bulk pricing rules
  - name: Categories
  - name: Categories (deprecated)
  - name: Category assignments
  - name: Category trees
  - name: Channel assignments
  - name: Complex rules
  - name: Custom fields
  - name: Images
  - name: Metafields
  - name: Product modifiers
  - name: Product variant options
  - name: Product variants
  - name: Products
  - name: Reviews
  - name: Sort order
  - name: Summary
  - name: Values
  - name: Variants (Batch)
  - name: Videos
paths:
  /catalog/brands:
    get:
      tags:
