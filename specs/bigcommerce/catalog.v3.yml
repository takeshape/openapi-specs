        type:
          type: string
          description: |
            The product type. One of: `physical` - a physical stock unit, `digital` - a digital download.
          example: physical
          enum:
            - physical
            - digital
        sku:
          maxLength: 255
          minLength: 0
          type: string
          description: >
            A unique user-defined alphanumeric product code/stock keeping unit (SKU). The SKU is always unique
            regardless of the letter case for both products and variants.
          example: SM-13
        description:
          type: string
          description: |
            The product description, which can include HTML formatting.
          example: >-
            <p><span>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi vel metus ac est egestas porta sed
            quis erat. Integer id nulla massa. Proin vitae enim nisi. Praesent non dignissim nulla. Nulla mattis id
            massa ac pharetra. Mauris et nisi in dolor aliquam sodales. Aliquam dui nisl, dictum quis leo sit amet,
            rutrum volutpat metus. Curabitur libero nunc, interdum ac libero non, tristique porttitor metus. Ut non
            dignissim lorem, in vestibulum leo. Vivamus sodales quis turpis eget.</span></p>
        weight:
          maximum: 9999999999
          minimum: 0
          type: number
          description: >
            Weight of the product, which can be used when calculating shipping costs. This is based on the unit set on
            the store.
          format: float
        width:
          maximum: 9999999999
          minimum: 0
          type: number
          description: |
            Width of the product, which can be used when calculating shipping costs.
          format: float
        depth:
          maximum: 9999999999
          minimum: 0
          type: number
          description: |
            Depth of the product, which can be used when calculating shipping costs.
          format: float
        height:
          maximum: 9999999999
          minimum: 0
          type: number
          description: |
            Height of the product, which can be used when calculating shipping costs.
          format: float
        price:
          minimum: 0
          type: number
          description: |
            The price of the product. The price should include or exclude tax, based on the store settings.
          format: float
        cost_price:
          minimum: 0
          type: number
          description: |
            The cost price of the product. Stored for reference only; it is not used or displayed anywhere on the store.
          format: float
        retail_price:
          minimum: 0
          type: number
          description: |
            The retail cost of the product. If entered, the retail cost price will be shown on the product page.
          format: float
        sale_price:
          minimum: 0
          type: number
          description: >
            If entered, the sale price will be used instead of value in the price field when calculating the productʼs
            cost.
          format: float
        map_price:
          type: number
          description: Minimum Advertised Price
        tax_class_id:
          maximum: 255
          minimum: 0
          type: number
          description: |
            The ID of the tax class applied to the product. (NOTE: Value ignored if automatic tax is enabled.)
        product_tax_code:
          maxLength: 255
          minLength: 0
          type: string
          description: >
            Tax Codes, such as AvaTax System Tax Codes, identify products and services that fall into special sales-tax
            categories. By using these codes, merchants who subscribe to a tax provider integration, such as
            BigCommerceʼs Avalara Premium, can calculate sales taxes more accurately. Stores without a tax provider will
            ignore the code when calculating sales tax. Do not pass more than one code. The codes are case-sensitive.
            For details, please see the tax providerʼs documentation.
        categories:
          type: array
          description: >
            An array of IDs for the categories to which this product belongs. When updating a product, if an array of
            categories is supplied, all product categories will be overwritten. Does not accept more than 1,000 ID
            values.
          items:
            type: number
          maximum: 1000
          minimum: 0
        brand_id:
          maximum: 1000000000
          minimum: 0
          type: integer
          description: >
            You can add a product to an existing brand during a product /PUT or /POST. Use either the `brand_id` or the
            `brand_name` field. The response body can include `brand_id`.
        brand_name:
          type: string
          description: >-
            You can create the brand during a product PUT or POST request. If the brand already exists, the product /PUT
            or /POST request adds the product to the brand. If not, the product /PUT or /POST request creates the brand
            and then adds the product to the brand. Brand name is not case-sensitive; "Common Good" and "Common good"
            are the same. Use either the `brand_id` or the `brand_name` field. The response body does not include
            `brand_name`.
          example: Common Good
        inventory_level:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: >-
            Current inventory level of the product. You must track inventory by _product_ for this to take effect (see
            the `inventory_tracking` field). The Catalog API returns the inventory for only the default location.


            The inventory for a product cannot exceed 2,147,483,647 in the catalog. If you exceed the limit, the store
            sets the inventory level to the limit.


            The Catalog API handles limits in a different way than the Inventory API. For more information, see [Limit
            handling](/docs/store-operations/catalog/inventory-adjustments#limit-handling-in-inventory-versus-catalog-api). 
        inventory_warning_level:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: >
            Inventory warning level for the product. When the productʼs inventory level drops below the warning level,
            the store owner will be informed. Simple inventory tracking must be enabled (see the `inventory_tracking`
            field) for this to take any effect.
        inventory_tracking:
          type: string
          description: >
            The type of inventory tracking for the product. Values are: `none` - inventory levels will not be tracked;
            `product` - inventory levels will be tracked using the `inventory_level` and `inventory_warning_level`
            fields; `variant` - inventory levels will be tracked based on variants, which maintain their own warning
            levels and inventory levels.
          enum:
            - none
            - product
            - variant
        fixed_cost_shipping_price:
          minimum: 0
          type: number
          description: >
            A fixed shipping cost for the product. If defined, this value will be used during checkout instead of normal
            shipping-cost calculation.
          format: float
        is_free_shipping:
          type: boolean
          description: >
            Flag used to indicate whether the product has free shipping. If `true`, the shipping cost for the product
            will be zero.
        is_visible:
          type: boolean
          description: >
            Flag to determine whether the product should be displayed to customers browsing the store. If `true`, the
            product will be displayed. If `false`, the product will be hidden from view.
        is_featured:
          type: boolean
          description: >
            Flag to determine whether the product should be included in the `featured products` panel when viewing the
            store.
        related_products:
          type: array
          description: |
            An array of IDs for the related products.
          items:
            type: integer
        warranty:
          maxLength: 65535
          minLength: 0
          type: string
          description: |
            Warranty information displayed on the product page. Can include HTML formatting.
        bin_picking_number:
          maxLength: 255
          minLength: 0
          type: string
          description: |
            The BIN picking number for the product.
        layout_file:
          maxLength: 500
          minLength: 0
          type: string
          description: >
            The layout template file used to render this product category. This field is writable only for stores with a
            Blueprint theme applied. For stores with a Stencil theme applied, see [Custom Template
            Associations](/docs/rest-content/custom-template-associations).
        upc:
          type: string
          maxLength: 14
          minLength: 0
          nullable: false
          description: >
            The product UPC code, which is used in feeds for shopping comparison sites and external channel
            integrations.
        search_keywords:
          maxLength: 65535
          minLength: 0
          type: string
          description: |
            A comma-separated list of keywords that can be used to locate the product when searching the store.
        availability_description:
          maxLength: 255
          minLength: 0
          type: string
          description: >
            Availability text displayed on the checkout page, under the product title. Tells the customer how long it
            will normally take to ship this product, such as: 'Usually ships in 24 hours.'
        availability:
          type: string
          description: >
            Availability of the product. (Corresponds to the productʼs
            [Purchasability](https://support.bigcommerce.com/s/article/Adding-Products-v3?language=en_US#sections)
            section in the control panel.) Supported values: `available` - the product is available for purchase;
            `disabled` - the product is listed on the storefront, but cannot be purchased; `preorder` - the product is
            listed for pre-orders.
          enum:
            - available
            - disabled
            - preorder
        gift_wrapping_options_type:
          type: string
          description: >
            Type of gift-wrapping options. Values: `any` - allow any gift-wrapping options in the store; `none` -
            disallow gift-wrapping on the product; `list` – provide a list of IDs in the `gift_wrapping_options_list`
            field.


            Always included in the response body; not applicable for the `include_fields` and `exclude_fields` query
            parameters.
          enum:
            - any
            - none
            - list
        gift_wrapping_options_list:
          type: array
          description: >
            A list of gift-wrapping option IDs.


            Always included in the response body; not applicable for the `include_fields` and `exclude_fields` query
            parameters.
          items:
            type: integer
        sort_order:
          type: integer
          description: >
            Priority to give this product when included in product lists on category pages and in search results. Lower
            integers will place the product closer to the top of the results.
          maximum: 2147483647
          minimum: -2147483648
        condition:
          type: string
          description: >
            The product condition. Will be shown on the product page if the `is_condition_shown` fieldʼs value is
            `true`. Possible values: `New`, `Used`, `Refurbished`.
          enum:
            - New
            - Used
            - Refurbished
        is_condition_shown:
          type: boolean
          description: |
            Flag used to determine whether the product condition is shown to the customer on the product page.
        order_quantity_minimum:
          maximum: 1000000000
          minimum: 0
          type: integer
          description: |
            The minimum quantity an order must contain, to be eligible to purchase this product.
        order_quantity_maximum:
          maximum: 1000000000
          minimum: 0
          type: integer
          description: |
            The maximum quantity an order can contain when purchasing the product.
        page_title:
          maxLength: 255
          minLength: 0
          type: string
          description: |
            Custom title for the product page. If not defined, the product name will be used as the meta title.
        meta_keywords:
          type: array
          maxLength: 65535
          minLength: 0
          description: |
            Custom meta keywords for the product page. If not defined, the storeʼs default keywords will be used.
          items:
            type: string
        meta_description:
          maxLength: 65535
          minLength: 0
          type: string
          description: >
            Custom meta description for the product page. If not defined, the storeʼs default meta description will be
            used.
        view_count:
          maximum: 1000000000
          minimum: 0
          type: integer
          description: |
            The number of times the product has been viewed.
          deprecated: true
        preorder_release_date:
          type: string
          description: >
            Pre-order release date. See the `availability` field for details on setting a productʼs availability to
            accept pre-orders.
          format: date-time
          nullable: true
        preorder_message:
          maxLength: 255
          minLength: 0
          type: string
          description: >
            Custom expected-date message to display on the product page. If undefined, the message defaults to the
            storewide setting. Can contain the `%%DATE%%` placeholder, which will be substituted for the release date.
        is_preorder_only:
          type: boolean
          description: >
            If set to true then on the preorder release date the preorder status will automatically be removed.

            If set to false, then on the release date the preorder status **will not** be removed. It will need to be
            changed manually either in the

            control panel or using the API. Using the API set `availability` to `available`.
        is_price_hidden:
          type: boolean
          description: >
            False by default, indicating that this productʼs price should be shown on the product page. If set to
            `true`, the price is hidden. (NOTE: To successfully set `is_price_hidden` to `true`, the `availability`
            value must be `disabled`.)
        price_hidden_label:
          maxLength: 200
          minLength: 0
          type: string
          description: >
            By default, an empty string. If `is_price_hidden` is `true`, the value of `price_hidden_label` is displayed
            instead of the price. (NOTE: To successfully set a non-empty string value with `is_price_hidden` set to
            `true`, the `availability` value must be `disabled`.)
        custom_url:
          $ref: '#/components/schemas/CustomUrl'
        open_graph_type:
          type: string
          description: |
            Type of product, defaults to `product`.
          enum:
            - product
            - album
            - book
            - drink
            - food
            - game
            - movie
            - song
            - tv_show
        open_graph_title:
          type: string
          description: |
            Title of the product, if not specified the product name will be used instead.
        open_graph_description:
          type: string
          description: |
            Description to use for the product, if not specified then the meta_description will be used instead.
        open_graph_use_meta_description:
          type: boolean
          description: |
            Flag to determine if product description or open graph description is used.
        open_graph_use_product_name:
          type: boolean
          description: |
            Flag to determine if product name or open graph name is used.
        open_graph_use_image:
          type: boolean
          description: |
            Flag to determine if product image or open graph image is used.
        gtin:
          type: string
          description: Global Trade Item Number
          nullable: false
          maxLength: 14
          minLength: 0
        mpn:
          type: string
          description: Manufacturer Part Number
          nullable: false
        date_last_imported:
          type: string
          description: the date when the Product had been imported
        reviews_rating_sum:
          type: integer
          description: |
            The total (cumulative) rating for the product.
          example: 3
        reviews_count:
          type: integer
          description: |
            The number of times the product has been rated.
          example: 4
        total_sold:
          type: integer
          description: |
            The total quantity of this product sold.
          example: 80
        custom_fields:
          type: array
          minimum: 0
          maximum: 255
          description: 200 maximum custom fields per product. 255 maximum characters per custom field.
          items:
            $ref: '#/components/schemas/ProductCustomFieldPut'
        bulk_pricing_rules:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  id:
                    type: integer
                    description: Unique ID of the *Bulk Pricing Rule*. Read-Only.
                    readOnly: true
                required:
                  - id
              - $ref: '#/components/schemas/BulkPricingRule'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        videos:
          type: array
          description: >
            The Catalog API integrates with third-party YouTube.

            The [YouTube Terms of Service](https://www.youtube.com/t/terms) and [Google Privacy
            Policy](https://policies.google.com/privacy) apply, as indicated in our [Privacy
            Policy](https://www.bigcommerce.com/privacy/) and [Terms of Service](https://www.bigcommerce.com/terms/).
          items:
            $ref: '#/components/schemas/ProductVideo'
