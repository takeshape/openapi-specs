        **Required Fields**

        * display_name

        * type

        * option_values


        **Read-Only Fields**

        * id


        **Limits**

        * 255 characters option name length.


        **Notes**


        * Only one variant option at a time can be created; individual variant options will contain an array of multiple
        values.

        * There are several examples listed below that create options, but the SKUs are not updated and they are not a
        variant on the product. Variant SKUs must be created with a separate request.

        * Variant options will show on the storefront as an option that can be selected by the customer. A request like
        this could be used to add new choices to a variant that has already been created.

        * If more than one variant needs to be created, use the [Create a
        Product](/docs/rest-catalog/products#create-a-product) endpoint.
      operationId: createProductVariantOption
      parameters:
        - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              title: Option Base
              description: Common Option properties.
              type: object
              properties:
                product_id:
                  type: integer
                  description: |
                    The unique numerical ID of the product to which the option belongs.
                  example: 4
                  x-required:
                    - post
                    - put
                display_name:
                  maxLength: 255
                  minLength: 1
                  type: string
                  description: |
                    The name of the option shown on the storefront.
                  example: Add-a-$5-Donation1535042499-187
                  x-required:
                    - post
                    - put
                type:
                  type: string
                  description: >
                    The type of option, which determines how it will display on the storefront. Acceptable values:
                    `radio_buttons`, `rectangles`, `dropdown`, `product_list`, `product_list_with_images`, `swatch`. For
                    reference, the former v2 API values are: RB = radio_buttons, RT = rectangles, S = dropdown, P =
                    product_list, PI = product_list_with_images, CS = swatch.
