                        description: |
                          A count of all inventory items in the catalog.
                        example: 2000
                      inventory_value:
                        type: number
                        description: |
                          Total value of storeʼs inventory.
                        format: double
                        example: 267000
                      primary_category_id:
                        type: integer
                        description: |
                          ID of the category containing the most products.
                        example: 23
                      primary_category_name:
                        type: string
                        description: |
                          Name of the category containing the most products.
                        example: Shop All
                      variant_count:
