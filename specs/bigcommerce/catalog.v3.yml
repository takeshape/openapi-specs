    InventoryLevelMaxParam:
      name: inventory_level:max
      in: query
      schema:
        type: integer
    InventoryLevelGreaterParam:
      name: inventory_level:greater
      in: query
      schema:
        type: integer
    InventoryLevelLessParam:
      name: inventory_level:less
      in: query
      schema:
        type: integer
    InventoryLowParam:
      name: inventory_low
      in: query
      description: |
        Filter items by inventory_low. Values: 1, 0.
      schema:
        type: integer
    OutOfStockParam:
      name: out_of_stock
      in: query
      description: |
        Filter items by out_of_stock. To enable the filter, pass `out_of_stock`=`1`.
      schema:
        type: integer
    TotalSoldParam:
      name: total_sold
      in: query
      description: |
        Filter items by total_sold.
      schema:
        type: integer
    ProductTypeParam:
      name: type
      in: query
      description: Filter items by type.
      schema:
        type: string
        enum:
          - digital
          - physical
    CategoriesParam:
      name: categories
      in: query
      description: |-
        Filter items by categories.
          If a product is in more than one category, using this query will not return the product. Instead use `categories:in=12`.
      schema:
        type: integer
    KeywordContextParam:
      name: keyword_context
      in: query
      description: >-
        Set context used by the search algorithm to return results targeted towards the specified group. Use `merchant`
        to help merchants search their own catalog. Use `shopper` to return shopper-facing search results.
      schema:
        type: string
        enum:
          - shopper
          - merchant
    AvailabilityParam:
      name: availability
      in: query
      description: |
        Filter items by availability. Values are: available, disabled, preorder.
      schema:
        type: string
        enum:
          - available
          - disabled
          - preorder
