  /catalog/brands/metafields:
    get:
      summary: Get All Brand Metafields
      tags:
        - Batch metafields
      description: Get all brand metafields.
      operationId: getBrandsMetafields
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    type: number
                  title:
                    type: string
                    minLength: 1
                  type:
                    type: string
                    minLength: 1
                  errors: {}
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/MetafieldKeyParam'
        - $ref: '#/components/parameters/MetafieldKeyInParam'
        - $ref: '#/components/parameters/MetafieldNamespaceParam'
        - $ref: '#/components/parameters/MetafieldNamespaceInParam'
        - $ref: '#/components/parameters/DirectionParam'
        - $ref: '#/components/parameters/IncludeFieldsParamMetafields'
        - $ref: '#/components/parameters/date_modified_min'
        - $ref: '#/components/parameters/date_modified_max'
        - $ref: '#/components/parameters/date_created_min'
        - $ref: '#/components/parameters/date_created_max'
        - $ref: '#/components/parameters/BeforeCursorParam'
        - $ref: '#/components/parameters/AfterCursorParam'
    post:
      summary: Create multiple metafields
      tags:
        - Batch metafields
      description: Create multiple metafields.
      operationId: createBrandsMetafields
      parameters:
        - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MetafieldPost'
        description: ''
      responses:
        '200':
          description: |
            List of created `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePostPut'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    type: number
                  title:
                    type: string
                    minLength: 1
                  type:
                    type: string
                    minLength: 1
                  detail:
                    type: string
                    minLength: 1
              example:
                status: 400
                title: Input is invalid
                type: https://developer.bigcommerce.com/api-docs/getting-started/api-status-codes
                detail: Syntax error
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccessPostPut'
    put:
      summary: Update multiple metafields
      tags:
        - Batch metafields
      description: Create multiple metafields.
      operationId: updateBrandsMetafields
      parameters:
        - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MetafieldFull'
        description: ''
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePostPut'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    type: number
                  title:
                    type: string
                    minLength: 1
                  type:
                    type: string
                    minLength: 1
                  errors:
                    type: object
                    properties: {}
              example:
                status: 400
                title: Input is invalid
                type: https://developer.bigcommerce.com/api-docs/getting-started/api-status-codes
                errors: {}
        '422':
          description: JSON data is missing or invalid
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    type: number
                  title:
                    type: string
                    minLength: 1
                  type:
                    type: string
                    minLength: 1
                  errors:
                    type: object
                    properties: {}
                    description: Empty for 200 responses.
    delete:
      summary: Delete Multiple Metafields
      tags:
        - Batch metafields
      description: Delete all brand metafields.
      operationId: deleteBrandsMetafields
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
        description: List of metafield IDs.
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    type: number
                  title:
                    type: string
                    minLength: 1
                  type:
                    type: string
                    minLength: 1
                  detail:
                    type: string
                    minLength: 1
              example:
                status: 400
                title: Input is invalid
                type: https://developer.bigcommerce.com/api-docs/getting-started/api-status-codes
                detail: Syntax error
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccessDelete'
    parameters:
      - $ref: '#/components/parameters/Accept'
  /catalog/brands/{brand_id}:
    get:
      tags:
        - Brands
      summary: Get a Brand
      description: Returns a single brand. Optional filter parameters can be passed in.
      operationId: getBrand
      parameters:
        - $ref: '#/components/parameters/IncludeFieldsQuery'
        - $ref: '#/components/parameters/ExcludeFieldsQuery'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Brand Response
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Brand'
                  meta:
                    $ref: '#/components/schemas/MetaEmpty'
                description: |-
                  Brand Response returns for:
                  * Create Brand
                  * Get Brand by Id
                  * Update Brand by Id
              example:
                data:
                  id: 50
                  name: Common Good
                  meta_keywords:
                    - modern
                    - clean
                    - contemporary
                  meta_description: Common Good is a modern brand
                  image_url: ''
                  search_keywords: kitchen, laundry, cart, storage
                  custom_url:
                    url: /brands/Common-Good.html
                    is_customized: false
                meta: {}
        '207':
          $ref: '#/components/responses/MultiStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ErrorWithDetails'
    put:
      tags:
        - Brands
      summary: Update a Brand
      description: |-
        Updates a brand.

        To update a brand image, send a request with an `image_url`.
      operationId: updateBrand
      parameters:
        - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Brand Response
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Brand'
                  meta:
                    $ref: '#/components/schemas/MetaEmpty'
                description: |-
                  Brand Response returns for:
                  * Create Brand
                  * Get Brand by Id
                  * Update Brand by Id
              example:
                data:
                  id: 50
                  name: Common Good
                  meta_keywords:
                    - modern
                    - clean
                    - contemporary
                  meta_description: Common Good is a modern brand
                  image_url: ''
                  search_keywords: kitchen, laundry, cart, storage
                  custom_url:
                    url: /brands/Common-Good.html
                    is_customized: false
                meta: {}
        '207':
          $ref: '#/components/responses/MultiStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
        '409':
          description: >
            The `Brand` was in conflict with another product. This is the result of duplicate unique values, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The `Brand` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Brands
      summary: Delete a Brand
      description: Deletes a brand.
      operationId: deleteBrand
      responses:
        '204':
          description: ''
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFoundError'
    parameters:
      - $ref: '#/components/parameters/BrandIdPath'
      - $ref: '#/components/parameters/Accept'
  /catalog/brands/{brand_id}/image:
    post:
      tags:
        - Images
      summary: Create a Brand Image
      description: >-
        Creates a brand image.


        **Required Fields**

        - image_file: Form posts are the only accepted upload option. For more information on how to upload an image see
        [Adding product images](/docs/store-operations/catalog#adding-product-images). NOTE:  Ensure you set the
        `Content-Type` header to `multipart/form-data; boundary=--example-boundary--` and set the correct URL for this
        endpoint.


        **Read-Only Fields**

        - id


        Only one image at a time can be created. To update a brand image, use the [Update a
        brand](/docs/rest-catalog/brands#update-a-brand) endpoint and an `image_url`.
      operationId: createBrandImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Brand Image Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      image_url:
                        type: string
                  meta:
                    $ref: '#/components/schemas/MetaEmpty'
              example:
                data:
                  image_url: https://cdn11.bigcommerce.com/s-{store_hash}/product_images/k/group_1545334669__76009.png
                meta: {}
        '400':
          description: >-
            Bad Request. The requested resource could not be downloaded and may be invalid. Possible reasons include
            malformed request syntax or the file host blocking requests.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseError'
        '422':
          description: >-
            Image was not valid. This is the result of a missing `image_file` field, or of an incorrect file type. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beta4errorResponse'
    delete:
      tags:
        - Images
      summary: Delete a Brand Image
      description: Deletes a brand image.
      operationId: deleteBrandImage
      responses:
        '204':
          description: ''
          content: {}
    parameters:
      - $ref: '#/components/parameters/BrandIdPath'
      - $ref: '#/components/parameters/Accept'
  /catalog/brands/{brand_id}/metafields:
    get:
      tags:
        - Metafields
      summary: Get brand metafields
      description: Returns a list of brand metafields. Optional filter parameters can be passed in.
      operationId: getBrandMetafields
      parameters:
        - $ref: '#/components/parameters/IdQuery'
        - $ref: '#/components/parameters/IdInQuery'
        - $ref: '#/components/parameters/IdNotInQuery'
        - $ref: '#/components/parameters/IdMinQuery'
        - $ref: '#/components/parameters/IdMaxQuery'
        - $ref: '#/components/parameters/IdGreaterQuery'
        - $ref: '#/components/parameters/IdLessQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/MetafieldKeyParam'
        - $ref: '#/components/parameters/MetafieldNamespaceParam'
        - $ref: '#/components/parameters/IncludeFieldsQuery'
        - $ref: '#/components/parameters/ExcludeFieldsQuery'
        - $ref: '#/components/parameters/BeforeCursorParam'
        - $ref: '#/components/parameters/AfterCursorParam'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Metafield Collection Response
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetafieldFull'
                  meta:
                    $ref: '#/components/schemas/MetaCollection'
              example:
                data:
                  - id: 6
                    key: Location
                    value: 4HG
                    namespace: Warehouse Locations
                    permission_set: app_only
                    resource_type: brand
                    resource_id: 111
                    description: Location in the warehouse
                    date_created: '1973-01-20T21:34:57.903Z'
                    date_modified: '1990-12-30T00:29:23.515Z'
                    owner_client_id: e8o0nm9ujew7byzu6x5dwjqe2rya2fv
                  - id: 7
                    key: Brand location
                    value: 4HG
                    namespace: Warehouse Locations
                    permission_set: read
                    resource_type: brand
                    resource_id: 111
                    description: Location in the warehouse
                    date_created: '1973-01-20T21:34:57.903Z'
                    date_modified: '1990-12-30T00:29:23.515Z'
                    owner_client_id: e8o0nm9ujew7byzu6x5dwjqe2rya2fv
                meta:
                  pagination:
                    total: 2
                    count: 2
                    per_page: 50
                    current_page: 1
                    total_pages: 1
                    links:
                      current: '?page=1&limit=50'
    post:
      tags:
        - Metafields
      summary: Create a Brand Metafield
      description: >-
        Creates a brand metafield.


        **Note:** The maximum number of metafields allowed on each order, product, category, variant, or brand is 250
        per client ID. For more information, see [Platform
        Limits](https://support.bigcommerce.com/s/article/Platform-Limits) in the Help Center.
      operationId: createBrandMetafield
      parameters:
        - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetafieldBase'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: Metafield Response
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MetafieldFull'
                  meta:
                    title: Meta
                    type: object
                    properties: {}
                    description: Empty meta object; may be used later.
              examples:
                example-1:
                  value:
                    data:
                      id: 4
